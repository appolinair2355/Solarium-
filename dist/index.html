    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-DOptuk1_.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-C-oB3Ezu.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CYj_vitT.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loader" style="
        position:fixed;inset:0;
        background:#07070d;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        font-family:'Inter',sans-serif;
        gap:20px;
      ">
        <div style="font-size:2.5rem;">🎲</div>
        <div style="
          color:#d4a843;font-size:1.1rem;font-weight:700;
          letter-spacing:0.08em;
        ">Prediction Baccara Pro</div>
        <div style="
          width:48px;height:48px;border-radius:50%;
          border:3px solid rgba(212,168,67,0.2);
          border-top-color:#d4a843;
          animation:spin 0.8s linear infinite;
        "></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      (function() {
        var KEY = '__loader_reload_ts';
        var MAX_WAIT = 25000;
        var timer = setTimeout(function() {
          var root = document.getElementById('root');
          var loader = document.getElementById('app-loader');
          if (loader && root && root.contains(loader)) {
            var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
            var now = Date.now();
            if (now - last > 30000) {
              sessionStorage.setItem(KEY, String(now));
              var url = new URL(window.location.href);
              url.searchParams.set('_r', String(now));
              window.location.replace(url.toString());
            }
          }
        }, MAX_WAIT);
        window.addEventListener('DOMContentLoaded', function() {
          var obs = new MutationObserver(function() {
            var loader = document.getElementById('app-loader');
            if (!loader) { clearTimeout(timer); obs.disconnect(); }
          });
          obs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </body>
