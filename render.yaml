services:
  - type: web
    name: baccarat-prediction-pro
    env: node
    buildCommand: npm install --production
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baccarat-db
          property: connectionString

databases:
  - name: baccarat-db
    plan: free
